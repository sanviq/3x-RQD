# Optional reference only. The local start script serves the frontend directly via FastAPI.
server {
    listen 127.0.0.1:8080;
    root /absolute/path/to/3x-rqd/frontend/dist;
    index index.html;
    client_max_body_size 110m;
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_read_timeout 300s;
    }
    location / { try_files $uri $uri/ /index.html; }
}
